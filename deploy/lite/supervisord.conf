; =============================================================================
; Bot Service Lite (meetings-only) — single-container process supervisor
; =============================================================================
; Runs the meeting-bot control plane in ONE container: the four long-running Python services
; (admin-api · runtime · meeting-api · gateway) over a shared Xvfb/PulseAudio audio-video stack.
; No agent-api, no terminal — API only. Redis is an EXTERNAL sidecar (see deploy/lite/Makefile) —
; not supervised here — so it survives an app-container restart/rebuild.
;
; The bot is NOT supervised here: the runtime (RUNTIME_BACKEND=process) spawns it as a CHILD
; PROCESS on demand via the in-container launcher (BOT_COMMAND — defaulted by the entrypoint to
; the /usr/local/bin launcher, interpolated here via %(ENV_…)s so operator-provided container env
; wins), sharing this container's display/audio.
; =============================================================================
[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
logfile_maxbytes=50MB
logfile_backups=3
loglevel=info

; supervisorctl wiring — without these sections `supervisorctl` (the README's debug entrypoint) has
; no socket to talk to. This config IS the main file (run directly), so it carries them itself.
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ─── Xvfb — virtual X11 display for the headful Chromium the bot drives ───────────────────────────
[program:xvfb]
command=Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset
autostart=true
autorestart=true
priority=10
startsecs=2
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

; ─── fluxbox — a WM so the browser window manages cleanly ─────────────────────────────────────────
[program:fluxbox]
command=fluxbox
environment=DISPLAY=":99"
autostart=true
autorestart=true
priority=11
startsecs=2
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

; ─── PulseAudio — the audio graph for the bot's capture/speak path ────────────────────────────────
[program:pulseaudio]
command=pulseaudio --system --disallow-exit --disallow-module-loading=false --log-level=notice
autostart=true
autorestart=true
priority=12
startsecs=2
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

; ─── PulseAudio sink setup (once, after PulseAudio is ready) ──────────────────────────────────────
[program:pulseaudio-setup]
command=/usr/local/bin/setup-pulseaudio-sinks.sh
autostart=true
autorestart=false
startsecs=0
priority=13
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

; ─── admin-api (:8001) — identity: users/tokens + /internal/validate (the gateway's authz oracle) ──
[program:admin-api]
command=/opt/venvs/admin/bin/python -m admin_api
directory=/app/admin-api
autostart=true
autorestart=true
priority=30
startsecs=10
startretries=3
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",PYTHONPATH="/app/admin-api/src",HOST="127.0.0.1",PORT="8001",LOG_LEVEL="%(ENV_LOG_LEVEL)s",DB_HOST="%(ENV_DB_HOST)s",DB_PORT="%(ENV_DB_PORT)s",DB_NAME="%(ENV_DB_NAME)s",DB_USER="%(ENV_DB_USER)s",DB_PASSWORD="%(ENV_DB_PASSWORD)s",ADMIN_API_TOKEN="%(ENV_ADMIN_API_TOKEN)s",INTERNAL_API_SECRET="%(ENV_INTERNAL_API_SECRET)s"

; ─── runtime (:8090) — runtime.v1; spawns the bot as a CHILD PROCESS (process backend) ────────────
[program:runtime]
command=/opt/venvs/runtime/bin/python -m runtime_kernel
directory=/app/runtime
autostart=true
autorestart=true
priority=35
startsecs=10
startretries=3
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",PYTHONPATH="/app/runtime/src",HOST="127.0.0.1",PORT="8090",LOG_LEVEL="%(ENV_LOG_LEVEL)s",RUNTIME_BACKEND="process",REDIS_URL="%(ENV_REDIS_URL)s",DISPLAY=":99",BOT_COMMAND="%(ENV_BOT_COMMAND)s",BROWSER_IMAGE="lite-process",INTERNAL_API_SECRET="%(ENV_INTERNAL_API_SECRET)s"

; ─── meeting-api (:8080) — lifecycle · bot_spawn · collector · recordings (→ minio) ───────────────
[program:meeting-api]
command=/opt/venvs/meeting/bin/python -m meeting_api
directory=/app/meeting-api
autostart=true
autorestart=true
priority=40
startsecs=10
startretries=3
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",PYTHONPATH="/app/meeting-api/src",HOST="127.0.0.1",PORT="8080",LOG_LEVEL="%(ENV_LOG_LEVEL)s",DB_HOST="%(ENV_DB_HOST)s",DB_PORT="%(ENV_DB_PORT)s",DB_NAME="%(ENV_DB_NAME)s",DB_USER="%(ENV_DB_USER)s",DB_PASSWORD="%(ENV_DB_PASSWORD)s",REDIS_URL="%(ENV_REDIS_URL)s",RUNTIME_API_URL="http://localhost:8090",MEETING_API_URL="http://localhost:8080",ADMIN_API_URL="http://localhost:8001",INTERNAL_API_SECRET="%(ENV_INTERNAL_API_SECRET)s",ADMIN_TOKEN="%(ENV_ADMIN_API_TOKEN)s",TRANSCRIPTION_SERVICE_URL="%(ENV_TRANSCRIPTION_SERVICE_URL)s",TRANSCRIPTION_SERVICE_TOKEN="%(ENV_TRANSCRIPTION_SERVICE_TOKEN)s",MINIO_ENDPOINT="%(ENV_MINIO_ENDPOINT)s",MINIO_ACCESS_KEY="%(ENV_MINIO_ACCESS_KEY)s",MINIO_SECRET_KEY="%(ENV_MINIO_SECRET_KEY)s",MINIO_BUCKET="%(ENV_MINIO_BUCKET)s",MINIO_SECURE="%(ENV_MINIO_SECURE)s"

; ─── gateway (:8056) — the one front door: auth · routing · /ws fan-out ───────────────────────────
[program:gateway]
command=/opt/venvs/gateway/bin/python -m gateway
directory=/app/gateway
autostart=true
autorestart=true
priority=50
startsecs=10
startretries=3
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
; fastapi-guard edge layer (edge_guard.py): ON by default with generous limits (owner ruling);
; opt out with -e GUARD_ENABLED=false (entrypoint.sh defaults it, then it passes through here).
; GUARD_WS_ENABLED is the optional /ws hook (off, opt-in): in-memory per-process — does NOT share
; ban/rate-limit state with the Redis-backed HTTP layer, and under uvicorn --workers N>1 each
; worker keeps an independent WS ban set. With GUARD_ENABLE_REDIS=false AND uvicorn --workers N>1
; the HTTP rate-limit buckets and auto-bans are likewise per-process: the effective limit becomes
; N × GUARD_RATE_LIMIT_RPM and bans do not propagate across workers. Other GUARD_* tuning keys inherit from container env.
; No agent-api in this build — AGENT_API_URL is left at the code default (unreachable); the
; gateway's /api/* agent proxy route simply 502s if ever called, which is expected (unsupported).
environment=PYTHONUNBUFFERED="1",PYTHONPATH="/app/gateway/src",HOST="0.0.0.0",PORT="8056",LOG_LEVEL="%(ENV_LOG_LEVEL)s",ADMIN_API_URL="http://localhost:8001",MEETING_API_URL="http://localhost:8080",REDIS_URL="%(ENV_REDIS_URL)s",INTERNAL_API_SECRET="%(ENV_INTERNAL_API_SECRET)s",GUARD_ENABLED="%(ENV_GUARD_ENABLED)s",GUARD_WS_ENABLED="%(ENV_GUARD_WS_ENABLED)s"

; ─── process group ────────────────────────────────────────────────────────────────────────────────
[group:bot-service]
programs=xvfb,fluxbox,pulseaudio,pulseaudio-setup,admin-api,runtime,meeting-api,gateway
priority=999
